# Hosts the Hermes web app (server.py) on Render's free plan.
# The two secrets are typed into Render's dashboard when the service is created,
# never stored in this file.
services:
  - type: web
    name: hermes
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-server.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: APP_NAME
        value: Hermes
      - key: GEMINI_MODEL
        value: gemini-flash-lite-latest
      - key: GEMINI_API_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: Hermes <verify@hermesguard.us>
